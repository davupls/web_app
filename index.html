<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <title>Bookmark Manager</title>
</head>
<body>
    <nav>
        <button class="menu-handheld"></button>
        <label>
            <input type="search" placeholder="Search by title...">
        </label>
        <button class="add_book"></button>
        <img src="/assets/images/image-avatar.webp" alt="user profile picture">
    </nav>

    <main>
        <div>
            <h1>All bookmarks</h1>
            <button>
                Sort by
            </button>
        </div>

        <article>
            <div class="book_head_section">
                <img src="/assets/images/favicon-32x32.png" alt="bookmark icon">
                <div>
                    <h2>Frontend Mentor</h2>
                    <p>frontendmentor.io</p>
                </div>
                <button>
                    <img src="assets/images/icon-menu-bookmark.svg">
                </button>
            </div>

            <div class="book_middle_section">
                <p>Improve your front-end coding skills by building real projects. Solve real-world HTML, CSS and JavaScript
                    challenges whilst working on professional designs.</p>
                <section class="book_tag_section">
                    <p>Practice</p>
                    <p>Learning</p>
                    <p>Community</p>
                </section>
            </div>

            <div class="book_footer_section">
                <img src="assets/images/icon-visit-count.svg">
                <img src="assets/images/icon-last-visited.svg">
                <img src="assets/images/icon-created.svg">
            </div>
            
        </article>


    </main>



</body>
</html>
